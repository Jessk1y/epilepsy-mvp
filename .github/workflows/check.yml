name: Проверка репозитория

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Данные и веса не в git, размер блокнотов
        run: python scripts/check_repo.py --all
